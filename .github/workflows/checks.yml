name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Unpinned on purpose: this job asks whether the current Claude Code
      # release loads the plugins.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - name: Validate the marketplace
        run: claude plugin validate --strict .
      - name: Validate each plugin
        run: |
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check plugin references
        run: python3 scripts/check-plugin-refs.py
      - name: shellcheck
        run: shellcheck plugins/*/hooks/*.sh scripts/*.sh
      - name: ruff
        run: pipx run ruff==0.17.0 check .
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  runner-guard:
    name: runner guard (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/test-runner-guard.sh
      - name: Test under the system /bin/bash (3.2 on macOS)
        if: runner.os == 'macOS'
        run: GUARD_BASH=/bin/bash bash scripts/test-runner-guard.sh
